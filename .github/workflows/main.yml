name: CI

on:
  push:
  pull_request:

jobs:

  tests:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@1285b95e32c783cfa40eb2ffbd6ca4cd023fb884 # v3.2.2
    with:
      envs: |
        - linux: py311-test
        - macos: py312-test
        - windows: py313-test
        - linux: py314-test

        # Development version of Hyperion, built from source
        - linux: py313-test-devdeps

  build:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish_pure_python.yml@1285b95e32c783cfa40eb2ffbd6ca4cd023fb884 # v3.2.2
    with:
      # The upload is done with trusted publishing in the job below, which
      # cannot be done from inside a reusable workflow
      save_artifacts: true
      upload_to_pypi: false
      test_extras: test
      test_command: pytest --pyargs hyperion_dust

  upload:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Upload built artifacts to PyPI
    runs-on: ubuntu-latest
    needs: [tests, build]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          pattern: dist-*
          path: dist

      - name: Run upload
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
