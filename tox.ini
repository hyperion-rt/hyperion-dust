[tox]
envlist =
    py{311,312,313,314}-test{,-devdeps}
isolated_build = true

[testenv]
changedir =
    test: .tmp/{envname}
description =
    test: run tests with pytest
    devdeps: with the development version of Hyperion
extras =
    test
deps =
    devdeps: hyperion @ git+https://github.com/hyperion-rt/hyperion.git
commands =
    pip freeze
    python -m pytest --pyargs hyperion_dust {posargs}
